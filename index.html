<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Music List</h1>
    </header>
    <main>
        <div class="controls">
            <button id="recommendBtn">Get a Recommendation</button>
            <input type="text" id="artistFilter" placeholder="Filter by artist...">
            <input type="number" id="ratingFilter" placeholder="Filter by minimum rating...">
            <input type="number" id="yearFilter" placeholder="Filter by year...">
            <button id="resetBtn">Reset Filters</button>
        </div>
        <div id="music-container"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
